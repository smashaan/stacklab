services:
  database:
    image: postgres:18.6
    restart: unless-stopped
    stop_grace_period: 1m
    environment:
      POSTGRES_USER: "${DIGITAL_TWIN_DB_USER:-digital_twin}"
      POSTGRES_PASSWORD: "${DIGITAL_TWIN_DB_PASSWORD:?Set DIGITAL_TWIN_DB_PASSWORD in .env}"
      POSTGRES_DB: "${DIGITAL_TWIN_DB_NAME:-digital_twin}"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - "${DIGITAL_TWIN_DB_SOURCE:-database}:/var/lib/postgresql"
      - ./init.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: database
      DB_PORT: "5432"
      DB_USER: "${DIGITAL_TWIN_DB_USER:-digital_twin}"
      DB_PASSWORD: "${DIGITAL_TWIN_DB_PASSWORD:?Set DIGITAL_TWIN_DB_PASSWORD in .env}"
      DB_NAME: "${DIGITAL_TWIN_DB_NAME:-digital_twin}"
      SECRET_KEY: "${DIGITAL_TWIN_SECRET_KEY:?Set DIGITAL_TWIN_SECRET_KEY in .env}"
      ADMIN_USER: "${DIGITAL_TWIN_ADMIN_USER:-admin}"
      ADMIN_PASSWORD: "${DIGITAL_TWIN_ADMIN_PASSWORD:?Set DIGITAL_TWIN_ADMIN_PASSWORD in .env}"
      ACCESS_TOKEN_MINUTES: "${DIGITAL_TWIN_ACCESS_TOKEN_MINUTES:-30}"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${DIGITAL_TWIN_BIND_ADDRESS:-127.0.0.1}:${DIGITAL_TWIN_PORT:-3000}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, --quiet, --tries=1, --spider, http://127.0.0.1:8080/health]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  database:
