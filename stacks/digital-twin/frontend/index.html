<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Stacklab Digital Twin</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">STACKLAB</p>
        <h1>Digital Twin</h1>
        <p class="subtitle">A focused inventory for rooms, devices, components and telemetry.</p>
      </div>
      <button id="logout" class="secondary hidden" type="button">Sign out</button>
    </header>

    <section id="login-panel" class="panel narrow">
      <h2>Sign in</h2>
      <form id="login-form">
        <label>Username<input id="username" name="username" autocomplete="username" required></label>
        <label>Password<input id="password" name="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">Sign in</button>
      </form>
      <p id="login-error" class="error" role="alert"></p>
    </section>

    <div id="application" class="hidden">
      <section id="summary" class="cards" aria-label="Inventory summary"></section>

      <div class="grid">
        <section class="panel">
          <div class="section-heading"><h2>Devices</h2><button id="refresh" class="secondary" type="button">Refresh</button></div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Name</th><th>Type</th><th>Room</th><th>Status</th></tr></thead>
              <tbody id="devices"></tbody>
            </table>
          </div>
        </section>

        <section class="panel">
          <h2>Add device</h2>
          <form id="device-form">
            <label>Name<input name="name" required maxlength="255"></label>
            <label>Device type<select name="device_type_id" id="device-types" required></select></label>
            <label>Room<select name="room_id" id="rooms"><option value="">Unassigned</option></select></label>
            <label>Status<input name="status" value="operational" required maxlength="50"></label>
            <button type="submit">Add device</button>
          </form>
          <p id="device-message" class="message" role="status"></p>
        </section>
      </div>

      <p class="api-link"><a href="/docs">Open authenticated API documentation</a></p>
    </div>
  </main>
</body>
</html>
