# Maintainer: replace every placeholder and remove services the stack does not
# need. This scaffold shows relationships and is not runnable as written.
services:
  product-one:
    image: ghcr.io/<org>/<product-one>:latest
    restart: unless-stopped
    ports:
      - "${STACK_BIND_ADDRESS:-127.0.0.1}:${PRODUCT_ONE_PORT:-8080}:8080"
    volumes:
      - "${PRODUCT_ONE_DATA_SOURCE:-product-one-data}:/data"
    environment:
      PRODUCT_TWO_URL: http://product-two:9000
    depends_on:
      product-two:
        condition: service_healthy

  product-two:
    image: ghcr.io/<org>/<product-two>:latest
    restart: unless-stopped
    volumes:
      - "${PRODUCT_TWO_DATA_SOURCE:-product-two-data}:/data"
    # Add a health check that uses a command present in this image.
    healthcheck:
      test: ["CMD", "<verified-health-command>"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  product-one-data:
  product-two-data:
