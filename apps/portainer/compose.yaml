services:
  portainer:
    image: portainer/portainer-ce:2.45.3
    restart: unless-stopped
    ports:
      - "${PORTAINER_BIND_ADDRESS:-127.0.0.1}:${PORTAINER_HTTPS_PORT:-9443}:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - "${PORTAINER_DATA_SOURCE:-data}:/data"

volumes:
  data:
