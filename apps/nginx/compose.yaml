services:
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx:size=32m,mode=0755
      - /var/run:size=1m,mode=0755
    ports:
      - "${NGINX_BIND_ADDRESS:-127.0.0.1}:${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - ./config/default.conf:/etc/nginx/conf.d/default.conf:ro
      - "${NGINX_CONTENT_SOURCE:-./html}:/usr/share/nginx/html:ro"
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/nginx-health]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
