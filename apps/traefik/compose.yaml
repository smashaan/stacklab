services:
  traefik:
    image: traefik:v3.7.16
    restart: unless-stopped
    environment:
      TRAEFIK_PROVIDERS_DOCKER_NETWORK: "${TRAEFIK_PROXY_NETWORK:-stacklab-proxy}"
    ports:
      - "${TRAEFIK_BIND_ADDRESS:-127.0.0.1}:${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_BIND_ADDRESS:-127.0.0.1}:${TRAEFIK_HTTPS_PORT:-443}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/traefik.yaml:/etc/traefik/traefik.yaml:ro
    labels:
      traefik.enable: "true"
      traefik.http.routers.dashboard.rule: "Host(`${TRAEFIK_DASHBOARD_HOST:-traefik.localhost}`)"
      traefik.http.routers.dashboard.entrypoints: web
      traefik.http.routers.dashboard.service: api@internal
      traefik.http.routers.dashboard.middlewares: dashboard-auth
      traefik.http.middlewares.dashboard-auth.basicauth.users: "${TRAEFIK_DASHBOARD_AUTH:?Set TRAEFIK_DASHBOARD_AUTH in .env}"
    healthcheck:
      test: [CMD, traefik, healthcheck, --ping]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - proxy

networks:
  proxy:
    name: "${TRAEFIK_PROXY_NETWORK:-stacklab-proxy}"
    external: true
