x-nextcloud-environment: &nextcloud-environment
  MYSQL_HOST: db
  MYSQL_DATABASE: "${NEXTCLOUD_DB_NAME:-nextcloud}"
  MYSQL_USER: "${NEXTCLOUD_DB_USER:-nextcloud}"
  MYSQL_PASSWORD: "${NEXTCLOUD_DB_PASSWORD:?Set NEXTCLOUD_DB_PASSWORD in .env}"
  REDIS_HOST: redis
  NEXTCLOUD_TRUSTED_DOMAINS: "${NEXTCLOUD_TRUSTED_DOMAINS:-localhost 127.0.0.1}"
  PHP_MEMORY_LIMIT: "${NEXTCLOUD_PHP_MEMORY_LIMIT:-512M}"
  PHP_UPLOAD_LIMIT: "${NEXTCLOUD_UPLOAD_LIMIT:-1G}"
  APACHE_BODY_LIMIT: "${NEXTCLOUD_APACHE_BODY_LIMIT:-1073741824}"

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED
    environment:
      MARIADB_ROOT_PASSWORD: "${NEXTCLOUD_DB_ROOT_PASSWORD:?Set NEXTCLOUD_DB_ROOT_PASSWORD in .env}"
      MARIADB_DATABASE: "${NEXTCLOUD_DB_NAME:-nextcloud}"
      MARIADB_USER: "${NEXTCLOUD_DB_USER:-nextcloud}"
      MARIADB_PASSWORD: "${NEXTCLOUD_DB_PASSWORD:?Set NEXTCLOUD_DB_PASSWORD in .env}"
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - "${NEXTCLOUD_DB_SOURCE:-database}:/var/lib/mysql"
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    image: nextcloud:34.0-apache
    restart: unless-stopped
    environment:
      <<: *nextcloud-environment
      NEXTCLOUD_ADMIN_USER: "${NEXTCLOUD_ADMIN_USER:?Set NEXTCLOUD_ADMIN_USER in .env}"
      NEXTCLOUD_ADMIN_PASSWORD: "${NEXTCLOUD_ADMIN_PASSWORD:?Set NEXTCLOUD_ADMIN_PASSWORD in .env}"
    ports:
      - "${NEXTCLOUD_BIND_ADDRESS:-127.0.0.1}:${NEXTCLOUD_PORT:-8080}:80"
    volumes:
      - "${NEXTCLOUD_DATA_SOURCE:-nextcloud}:/var/www/html"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  cron:
    image: nextcloud:34.0-apache
    restart: unless-stopped
    entrypoint: /cron.sh
    environment: *nextcloud-environment
    volumes:
      - "${NEXTCLOUD_DATA_SOURCE:-nextcloud}:/var/www/html"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started

volumes:
  database:
  nextcloud:
