services:
  mosquitto:
    image: eclipse-mosquitto:2.1-alpine
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    ports:
      - "${MOSQUITTO_BIND_ADDRESS:-127.0.0.1}:${MOSQUITTO_PORT:-1883}:1883"
    volumes:
      - ./config:/mosquitto/config:ro
      - "${MOSQUITTO_DATA_SOURCE:-data}:/mosquitto/data"

volumes:
  data:
